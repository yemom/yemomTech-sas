# =============================================================
# YemomTech (YemomBizGrow) — DEVELOPMENT compose
# Local development only. Never deploy this file as-is:
#   - database/redis ports are published for local tooling
#   - credentials come from .env (see .env.example)
# Production runs on managed PostgreSQL/Redis (Render) with
# private networking and no published database ports.
# =============================================================
name: YemomBizGrow

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-YemomBizGrow}
      POSTGRES_USER: ${POSTGRES_USER:-YemomBizGrow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-YemomBizGrow_password}
    ports:
      - "5635:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6637:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-YemomBizGrow}
      DATABASE_USERNAME: ${POSTGRES_USER:-YemomBizGrow_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-YemomBizGrow_password}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-dev_only_secret_not_for_production_use_0123456789abcdef}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3101}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY:-}
      CHAPA_WEBHOOK_SECRET: ${CHAPA_WEBHOOK_SECRET:-}
      # DEV-ONLY AES key. It is public (committed here) and useless as a
      # secret; StartupValidator refuses it in any strict profile. Production
      # never uses this file — secrets come from the platform's store.
      ENCRYPTION_KEY: EydsM2kgwpuNGxgEPhOGI50mdGFXRw3HgzUVqMKYLiE=
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3001/workspace/analytics/callback}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-${MAIL_HOST:-}}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-${MAIL_PORT:-587}}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-${MAIL_USERNAME:-}}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-${MAIL_PASSWORD:-}}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # A second backend instance, used only for the multi-instance Redis failure
  # drill (see docs/DEPLOYMENT.md). Not started by default:
  #   docker compose --profile scale up -d
  backend2:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    profiles: ["scale"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-YemomBizGrow}
      DATABASE_USERNAME: ${POSTGRES_USER:-YemomBizGrow_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-YemomBizGrow_password}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-dev_only_secret_not_for_production_use_0123456789abcdef}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3101}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      # DEV-ONLY AES key. It is public (committed here) and useless as a
      # secret; StartupValidator refuses it in any strict profile. Production
      # never uses this file — secrets come from the platform's store.
      ENCRYPTION_KEY: EydsM2kgwpuNGxgEPhOGI50mdGFXRw3HgzUVqMKYLiE=
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3001/workspace/analytics/callback}
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY:-}
      CHAPA_WEBHOOK_SECRET: ${CHAPA_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-${MAIL_HOST:-}}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-${MAIL_PORT:-587}}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-${MAIL_USERNAME:-}}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-${MAIL_PASSWORD:-}}
    ports:
      - "8091:8080"

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "3001:3000"
    healthcheck:
      # 127.0.0.1, not "localhost": the server binds IPv4 only, and "localhost"
      # can resolve to ::1 first, which fails with "connection refused".
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  redisdata:
