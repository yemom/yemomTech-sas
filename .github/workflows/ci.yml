name: CI — Full pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# -----------------------------------------------------------------------
# Global defaults
# -----------------------------------------------------------------------
env:
  # Backend
  JAVA_VERSION: "21"
  # Frontend
  NODE_VERSION: "22"
  # Docker
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # =====================================================================
  # JOB 1: Backend — unit + integration tests
  # =====================================================================
  backend-test:
    name: Backend tests (unit + ITs)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Ensure mvnw has execute permissions on Linux runners
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Testcontainers spins its own Postgres/Redis — no service containers needed
      - name: Run unit tests
        run: ./mvnw -B test -q

      - name: Run integration tests (Testcontainers)
        run: ./mvnw -B failsafe:integration-test failsafe:verify -q

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  # =====================================================================
  # JOB 2: Frontend — typecheck, lint, unit tests, build
  # =====================================================================
  frontend-test:
    name: Frontend checks (typecheck + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com/api/v1

      - name: Upload build artifact (for Docker job)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 1

  # =====================================================================
  # JOB 4: E2E - real browser against the real stack
  # =====================================================================
  e2e:
    name: E2E (Playwright, real browser + real stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-test, frontend-test]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # Google Chrome ships with the runner image; Chromium is downloaded
        # here so the "chromium" project always has a matching browser.
        run: npx playwright install --with-deps chromium

      - name: Build and start the full stack (Postgres, Redis, backend, frontend)
        run: docker compose up -d --build
        working-directory: .

      - name: Wait for the stack to become healthy
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null 2>&1 \
               && curl -fsS http://localhost:3001/ >/dev/null 2>&1; then
              echo "Stack is up."
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become healthy in time."
          docker compose ps
          docker compose logs --tail 100
          exit 1
        working-directory: .

      - name: Run Playwright E2E
        # CI=true, so Playwright does not start its own server — the suite
        # runs against the frontend container that was just built and started
        # above (the exact artifact that ships).
        run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:3001

      - name: Verify the database backup and restore procedure
        # Backs the running database up, restores it into an isolated scratch
        # database and compares every table. The scratch database is dropped
        # again; the application database is never modified.
        run: bash infrastructure/scripts/postgres-backup.sh verify
        working-directory: .

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # =====================================================================
  # JOB 5: Dependency vulnerability scan
  # =====================================================================
  dependency-scan:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ env.JAVA_VERSION }}"
          cache: maven

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # OWASP Dependency-Check for the Maven dependencies (Java).
      - name: Scan Maven dependencies (OWASP Dependency-Check)
        uses: dependency-check/Dependency-Check_Action@v4
        with:
          project: backend
          scan-format: sarif
          output-file: frontend/dependency-check-report.sarif
          # The NVD API is rate limited without a key; the scan still runs
          # against the advisory cache and fails the build on known CVEs.
          args: --enableExperimental --nvdApiKey=${{ secrets.NVD_API_KEY }}

      - name: Scan npm dependencies (npm audit)
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high --omit=dev || \
            echo "::warning::npm audit reported vulnerabilities (see the job log)"

      - name: Upload the dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-report
          path: frontend/dependency-check-report.sarif
          retention-days: 7

  # =====================================================================
  # JOB 6: Backend Docker image (main branch only)
  # =====================================================================
  backend-docker:
    name: Build & push backend Docker image
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =====================================================================
  # JOB 7: Frontend Docker image (main branch only)
  # =====================================================================
  frontend-docker:
    name: Build & push frontend Docker image
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/frontend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
