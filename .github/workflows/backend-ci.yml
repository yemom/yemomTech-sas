name: Backend CI

# This workflow is superseded by ci.yml which runs the full pipeline.
# Kept here so PRs that only touch backend/ still get fast feedback
# without waiting for the frontend job.

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers provisions its own Postgres + Redis containers.
      # No services block needed here — Docker is available on ubuntu-latest.
      - name: Run unit tests
        run: ./mvnw -B test -q

      - name: Run integration tests (Testcontainers)
        run: ./mvnw -B failsafe:integration-test failsafe:verify -q

      - name: Upload surefire/failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7
