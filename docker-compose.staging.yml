# =============================================================
# YemomBizGrow — STAGING compose (public HTTPS rehearsal)
#
# Purpose: run the exact production topology — prod-profile backend
# (secure cookies, SameSite=None, exact CORS, no springdoc), the
# frontend built with the PUBLIC API URL baked in, and a TLS-terminating
# reverse proxy in front of both — on any host that has Docker.
#
# This is a SEPARATE project from the development compose
# (docker-compose.yml): its own project name, its own database and
# Redis (not published to the host), its own volumes. It never touches
# development data.
#
# All secrets are REQUIRED — the file refuses to start with development
# defaults (no `${VAR:-dev_only_...}` patterns; `:?` aborts instead).
#
# Usage:
#   cp .env.staging.example .env.staging     # then fill in real values
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
#
# Rehearsal on a machine without a public domain (self-signed internal
# CA): the audit script and Playwright accept the CA via
#   AUDIT_CURL_EXTRA="--cacert <root.crt>" bash infrastructure/scripts/staging-auth-audit.sh https://<api-host>/api/v1
#   E2E_IGNORE_TLS_ERRORS=1 npx playwright test ...
# On a real staging domain with ports 80/443, remove `tls internal`
# from the Caddyfile (Caddy then issues public certificates via ACME).
# =============================================================
name: yemombizgrow-staging-stack

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Deliberately NO host port publishing: the database is reachable
    # only inside this project's network (production discipline).
    environment:
      POSTGRES_DB: ${STAGING_DB_NAME:?set STAGING_DB_NAME in .env.staging}
      POSTGRES_USER: ${STAGING_DB_USER:?set STAGING_DB_USER}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?set STAGING_DB_PASSWORD}
    volumes:
      - staging-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # No host port publishing (production discipline).
    volumes:
      - staging-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: yemombizgrow-backend-staging:latest
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${STAGING_DB_NAME}
      DATABASE_USERNAME: ${STAGING_DB_USER}
      DATABASE_PASSWORD: ${STAGING_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${STAGING_JWT_SECRET:?set STAGING_JWT_SECRET (openssl rand -base64 64)}
      ENCRYPTION_KEY: ${STAGING_ENCRYPTION_KEY:?set STAGING_ENCRYPTION_KEY (openssl rand -base64 32)}
      CORS_ALLOWED_ORIGINS: ${STAGING_FRONTEND_ORIGIN:?set STAGING_FRONTEND_ORIGIN (exact https origin)}
      FRONTEND_URL: ${STAGING_FRONTEND_ORIGIN}
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "None"
      GOOGLE_CLIENT_ID: ${STAGING_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${STAGING_GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${STAGING_GOOGLE_REDIRECT_URI:-}
      CHAPA_SECRET_KEY: ${STAGING_CHAPA_SECRET_KEY:-}
      CHAPA_WEBHOOK_SECRET: ${STAGING_CHAPA_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${STAGING_OPENAI_API_KEY:-}
      SPRING_MAIL_HOST: ${STAGING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${STAGING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${STAGING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${STAGING_MAIL_PASSWORD:-}
      MAIL_FROM: ${STAGING_MAIL_FROM:-}
      MAIL_FROM_NAME: ${STAGING_MAIL_FROM_NAME:-}

  frontend:
    image: yemombizgrow-frontend-staging:latest
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      # The PUBLIC api origin is baked into the browser bundle. The
      # Dockerfile refuses to build without it (no silent localhost).
      args:
        NEXT_PUBLIC_API_BASE_URL: ${STAGING_API_PUBLIC_URL:?set STAGING_API_PUBLIC_URL (https://api-host/api/v1)}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${STAGING_API_PUBLIC_URL}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    environment:
      # The Caddyfile resolves site addresses from the container env; the
      # --env-file values only do host-side ${...} substitution, so the two
      # host names must be forwarded explicitly.
      STAGING_APP_HOST: ${STAGING_APP_HOST:?set STAGING_APP_HOST}
      STAGING_API_HOST: ${STAGING_API_HOST:?set STAGING_API_HOST}
    volumes:
      - ./infrastructure/docker/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - staging-caddy-data:/data
      - staging-caddy-config:/config
    ports:
      # App and API each get their own HTTPS listener, mirroring the
      # production topology (app and API on different origins).
      - "${STAGING_HTTPS_APP_PORT:-4443}:4443"
      - "${STAGING_HTTPS_API_PORT:-8443}:8443"

volumes:
  staging-pgdata:
  staging-redisdata:
  staging-caddy-data:
  staging-caddy-config:
