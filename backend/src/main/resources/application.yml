# =============================================================
# Base configuration — shared by every profile.
# Contains NO development defaults for secrets: unresolved
# placeholders force the active profile or environment to supply
# real values (production startup validation enforces this too).
# =============================================================
spring:
  application:
    name: YemomBizGrow-backend
  profiles:
    # Local `mvn spring-boot:run` without -Dspring-boot.run.profiles=... uses dev.
    default: dev

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    # Flyway owns the schema; Hibernate only verifies entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  jackson:
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

server:
  port: ${APP_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900}
      refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
    cookie:
      # dev: Lax (localhost:3000 -> localhost:8080 is same-site).
      # prod: None + Secure (Vercel -> Render is cross-site).
      same-site: ${COOKIE_SAME_SITE:Lax}
      secure: ${COOKIE_SECURE:false}
    cors:
      # Exact origins only; wildcard + credentials is rejected at startup.
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
      window-minutes: ${LOGIN_WINDOW_MINUTES:15}
    invitation:
      # Never true in production (validated at startup).
      expose-dev-token: false
    encryption:
      key: ${ENCRYPTION_KEY:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/workspace/analytics/callback}
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:3000}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

bizgrow:
  billing:
    chapa:
      secret-key: ${CHAPA_SECRET_KEY:}
      webhook-secret: ${CHAPA_WEBHOOK_SECRET:}
