# =============================================================
# DEVELOPMENT profile — safe local defaults only.
# Every secret here is publicly known and intentionally useless
# outside localhost. Startup validation rejects these values when
# any profile other than dev/test is active.
# =============================================================
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5635/YemomBizGrow}
    username: ${DATABASE_USERNAME:YemomBizGrow_user}
    password: ${DATABASE_PASSWORD:YemomBizGrow_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6637}
      password: ${REDIS_PASSWORD:}

app:
  security:
    encryption:
      key: ${ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    jwt:
      secret: ${JWT_SECRET:dev_only_secret_do_not_use_in_production_0a1b2c3d4e5f6789abcdef}
    cors:
      # Dev allows both common Next.js ports; production must set an exact list.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3101}
    invitation:
      # Raw invitation tokens are returned to the developer in dev so the
      # invite flow is testable without SMTP. Production must never do this.
      expose-dev-token: true

management:
  endpoints:
    web:
      exposure:
        # The metrics endpoint is exposed in the development profile so the
        # degraded-security-control counter (bizgrow.security.controls.degraded)
        # can be read locally. Production keeps the surface minimal; expose it
        # only behind an internal network or an authenticated proxy there.
        include: health,info,metrics
  health:
    mail:
      # Local development has no SMTP server. Without this the mail indicator
      # fails and drags the *aggregate* health endpoint to DOWN, which makes
      # the whole service look broken (and trips any external monitor) even
      # though the API is fully functional. Production keeps the indicator on,
      # because a broken mail relay there really is an incident.
      enabled: false

logging:
  level:
    com.YemomBizGrow: DEBUG
    org.flywaydb: INFO
